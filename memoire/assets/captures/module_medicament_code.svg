  <text x="54" y="162" class="paneltitle">src/modules/medicament/medicament.service.ts | lignes 29-57</text>
  <text x="54" y="196" class="code" xml:space="preserve">
    <tspan x="54" dy="0"> 29 |   private async ensureFournisseurExists(fournisseurId: string) {</tspan>
    <tspan x="54" dy="18"> 30 |     const fournisseur = await this.medicamentRepository.findFournisseurById(fournisseurId);</tspan>
    <tspan x="54" dy="18"> 31 | </tspan>
    <tspan x="54" dy="18"> 32 |     if (!fournisseur) {</tspan>
    <tspan x="54" dy="18"> 33 |       throw new AppError(404, "Fournisseur introuvable.", {</tspan>
    <tspan x="54" dy="18"> 34 |         fournisseurId,</tspan>
    <tspan x="54" dy="18"> 35 |       });</tspan>
    <tspan x="54" dy="18"> 36 |     }</tspan>
    <tspan x="54" dy="18"> 37 |   }</tspan>
    <tspan x="54" dy="18"> 38 | </tspan>
    <tspan x="54" dy="18"> 39 |   private validateBusinessRules(data: {</tspan>
    <tspan x="54" dy="18"> 40 |     prix?: number;</tspan>
    <tspan x="54" dy="18"> 41 |     qteStock?: number;</tspan>
    <tspan x="54" dy="18"> 42 |     dateExpiration?: Date;</tspan>
    <tspan x="54" dy="18"> 43 |   }) {</tspan>
    <tspan x="54" dy="18"> 44 |     if (data.prix !== undefined &amp;&amp; data.prix &lt;= 0) {</tspan>
    <tspan x="54" dy="18"> 45 |       throw new AppError(422, "Le prix du medicament doit etre strictement superieur a 0.");</tspan>
    <tspan x="54" dy="18"> 46 |     }</tspan>
    <tspan x="54" dy="18"> 47 | </tspan>
    <tspan x="54" dy="18"> 48 |     if (data.qteStock !== undefined &amp;&amp; data.qteStock &lt; 0) {</tspan>
    <tspan x="54" dy="18"> 49 |       throw new AppError(422, "La quantite en stock doit etre positive ou nulle.");</tspan>
    <tspan x="54" dy="18"> 50 |     }</tspan>
    <tspan x="54" dy="18"> 51 | </tspan>
    <tspan x="54" dy="18"> 52 |     if (data.dateExpiration &amp;&amp; !isStrictlyAfterToday(data.dateExpiration)) {</tspan>
    <tspan x="54" dy="18"> 53 |       throw new AppError(</tspan>
    <tspan x="54" dy="18"> 54 |         422,</tspan>
    <tspan x="54" dy="18"> 55 |         "La date d'expiration doit etre strictement superieure a aujourd'hui.",</tspan>
    <tspan x="54" dy="18"> 56 |       );</tspan>
    <tspan x="54" dy="18"> 57 |     }</tspan>
  </text>
