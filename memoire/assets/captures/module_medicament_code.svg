<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1298" role="img" aria-labelledby="title desc">
  <title id="title">Capture reelle du module Medicaments</title>
  <desc id="desc">Le module verifie le fournisseur, le prix, le stock et la date d expiration avant ecriture.</desc>
