  <rect x="18" y="18" width="1364" height="1262" class="frame"/>
  <text x="36" y="68" class="title">Capture reelle du module Medicaments</text>
  <text x="36" y="96" class="subtitle">Le module verifie le fournisseur, le prix, le stock et la date d expiration avant ecriture.</text>
  <text x="36" y="118" class="note">Capture composee a partir des fichiers reels du depot GesPharmacie.</text>
