  <text x="54" y="790" class="paneltitle">src/modules/medicament/medicament.service.ts | lignes 64-70</text>
  <text x="54" y="824" class="code" xml:space="preserve">
    <tspan x="54" dy="0"> 64 |   async create(data: CreateMedicamentDTO) {</tspan>
    <tspan x="54" dy="18"> 65 |     await this.ensureCodeAvailable(data.code);</tspan>
    <tspan x="54" dy="18"> 66 |     await this.ensureFournisseurExists(data.fournisseurId);</tspan>
    <tspan x="54" dy="18"> 67 |     this.validateBusinessRules(data);</tspan>
    <tspan x="54" dy="18"> 68 | </tspan>
    <tspan x="54" dy="18"> 69 |     return this.medicamentRepository.create(data);</tspan>
    <tspan x="54" dy="18"> 70 |   }</tspan>
  </text>
