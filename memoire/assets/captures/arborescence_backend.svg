<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Capture technique de l'arborescence backend</title>
  <desc id="desc">Representation de la structure reelle du projet backend issue de la commande tree.</desc>
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .bar { fill: #ececec; stroke: #111111; stroke-width: 2; }
      .dot { fill: #111111; }
      .title { font: 700 24px 'Liberation Sans', Arial, sans-serif; fill: #111111; }
      .mono { font: 400 18px 'Liberation Mono', 'Courier New', monospace; fill: #111111; }
      .small { font: 400 14px 'Liberation Sans', Arial, sans-serif; fill: #444444; }
    </style>
  </defs>

  <rect x="24" y="24" width="1152" height="812" class="frame"/>
  <rect x="24" y="24" width="1152" height="54" class="bar"/>
  <circle cx="58" cy="51" r="7" class="dot"/>
  <circle cx="82" cy="51" r="7" class="dot" opacity="0.65"/>
  <circle cx="106" cy="51" r="7" class="dot" opacity="0.35"/>
