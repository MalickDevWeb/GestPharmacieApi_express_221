<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Capture technique de la documentation OpenAPI</title>
  <desc id="desc">Extrait representatif du document OpenAPI defini dans le projet backend.</desc>
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .bar { fill: #ececec; stroke: #111111; stroke-width: 2; }
      .dot { fill: #111111; }
      .title { font: 700 24px 'Liberation Sans', Arial, sans-serif; fill: #111111; }
      .mono { font: 400 16.5px 'Liberation Mono', 'Courier New', monospace; fill: #111111; }
      .small { font: 400 14px 'Liberation Sans', Arial, sans-serif; fill: #444444; }
    </style>
  </defs>

  <rect x="24" y="24" width="1152" height="852" class="frame"/>
  <rect x="24" y="24" width="1152" height="54" class="bar"/>
  <circle cx="58" cy="51" r="7" class="dot"/>
  <circle cx="82" cy="51" r="7" class="dot" opacity="0.65"/>
  <circle cx="106" cy="51" r="7" class="dot" opacity="0.35"/>
  <text x="140" y="58" class="title">Capture technique 4. Extrait OpenAPI / Swagger</text>

  <text x="58" y="118" class="mono">openapi: 3.0.3</text>
  <text x="58" y="146" class="mono">info:</text>
  <text x="58" y="174" class="mono">  title: PHARMA 221 API</text>
  <text x="58" y="202" class="mono">  version: 1.0.0</text>
  <text x="58" y="258" class="mono">servers:</text>
  <text x="58" y="286" class="mono">  - /api/v1</text>
  <text x="58" y="314" class="mono">  - https://pharmacie-221.onrender.com/api/v1</text>
  <text x="58" y="370" class="mono">paths:</text>
  <text x="58" y="398" class="mono">  /health</text>
  <text x="58" y="426" class="mono">  /auth/login</text>
  <text x="58" y="454" class="mono">  /auth/me</text>
  <text x="58" y="482" class="mono">  /clients</text>
  <text x="58" y="510" class="mono">  /clients/{id}</text>
  <text x="58" y="538" class="mono">  /fournisseurs</text>
  <text x="58" y="566" class="mono">  /fournisseurs/{id}</text>
  <text x="58" y="594" class="mono">  /medicaments</text>
  <text x="58" y="622" class="mono">  /medicaments/{id}</text>
  <text x="58" y="650" class="mono">  /ventes</text>
  <text x="58" y="678" class="mono">  /ventes/{id}</text>
  <text x="58" y="734" class="mono">securitySchemes: bearerAuth</text>

  <text x="58" y="792" class="small">Source: src/docs/openapi.ts et routes documentees automatiquement dans Swagger UI.</text>
</svg>
