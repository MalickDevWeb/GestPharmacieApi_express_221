  <text x="54" y="376" class="paneltitle">src/modules/vente/vente.service.ts | lignes 30-84</text>
  <text x="54" y="410" class="code" xml:space="preserve">
    <tspan x="54" dy="0"> 30 |   async create(data: CreateVenteDTO) {</tspan>
    <tspan x="54" dy="18"> 31 |     return this.venteRepository.transaction(async (transaction) =&gt; {</tspan>
    <tspan x="54" dy="18"> 32 |       const client = await this.venteRepository.findClientById(data.clientId, transaction);</tspan>
    <tspan x="54" dy="18"> 33 | </tspan>
    <tspan x="54" dy="18"> 34 |       if (!client) {</tspan>
    <tspan x="54" dy="18"> 35 |         throw new AppError(404, "Client introuvable.", {</tspan>
    <tspan x="54" dy="18"> 36 |           clientId: data.clientId,</tspan>
    <tspan x="54" dy="18"> 37 |         });</tspan>
    <tspan x="54" dy="18"> 38 |       }</tspan>
    <tspan x="54" dy="18"> 39 | </tspan>
