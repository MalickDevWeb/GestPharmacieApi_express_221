  <text x="54" y="1506" class="code" xml:space="preserve">
    <tspan x="54" dy="0"> 60 |   async decrementMedicamentStock(</tspan>
    <tspan x="54" dy="18"> 61 |     id: string,</tspan>
    <tspan x="54" dy="18"> 62 |     quantite: number,</tspan>
    <tspan x="54" dy="18"> 63 |     transaction: Prisma.TransactionClient,</tspan>
    <tspan x="54" dy="18"> 64 |   ): Promise&lt;Medicament&gt; {</tspan>
    <tspan x="54" dy="18"> 65 |     return transaction.medicament.update({</tspan>
    <tspan x="54" dy="18"> 66 |       where: {</tspan>
    <tspan x="54" dy="18"> 67 |         id,</tspan>
    <tspan x="54" dy="18"> 68 |       },</tspan>
    <tspan x="54" dy="18"> 69 |       data: {</tspan>
    <tspan x="54" dy="18"> 70 |         qteStock: {</tspan>
    <tspan x="54" dy="18"> 71 |           decrement: quantite,</tspan>
    <tspan x="54" dy="18"> 72 |         },</tspan>
    <tspan x="54" dy="18"> 73 |       },</tspan>
    <tspan x="54" dy="18"> 74 |     });</tspan>
    <tspan x="54" dy="18"> 75 |   }</tspan>
    <tspan x="54" dy="18"> 76 | </tspan>
    <tspan x="54" dy="18"> 77 |   async create(</tspan>
    <tspan x="54" dy="18"> 78 |     data: CreateVenteRecord,</tspan>
