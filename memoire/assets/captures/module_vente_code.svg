    <tspan x="54" dy="18"> 42 |         transaction,</tspan>
    <tspan x="54" dy="18"> 43 |       );</tspan>
    <tspan x="54" dy="18"> 44 | </tspan>
    <tspan x="54" dy="18"> 45 |       if (!medicament) {</tspan>
    <tspan x="54" dy="18"> 46 |         throw new AppError(404, "Medicament introuvable.", {</tspan>
    <tspan x="54" dy="18"> 47 |           medicamentId: data.medicamentId,</tspan>
    <tspan x="54" dy="18"> 48 |         });</tspan>
    <tspan x="54" dy="18"> 49 |       }</tspan>
    <tspan x="54" dy="18"> 50 | </tspan>
    <tspan x="54" dy="18"> 51 |       if (!isStrictlyAfterToday(medicament.dateExpiration)) {</tspan>
    <tspan x="54" dy="18"> 52 |         throw new AppError(409, "Vente refusee: le medicament est expire.", {</tspan>
    <tspan x="54" dy="18"> 53 |           medicamentId: data.medicamentId,</tspan>
    <tspan x="54" dy="18"> 54 |           dateExpiration: medicament.dateExpiration,</tspan>
    <tspan x="54" dy="18"> 55 |         });</tspan>
    <tspan x="54" dy="18"> 56 |       }</tspan>
    <tspan x="54" dy="18"> 57 | </tspan>
    <tspan x="54" dy="18"> 58 |       if (medicament.qteStock &lt; data.quantite) {</tspan>
    <tspan x="54" dy="18"> 59 |         throw new AppError(409, "Stock insuffisant pour effectuer la vente.", {</tspan>
    <tspan x="54" dy="18"> 60 |           medicamentId: data.medicamentId,</tspan>
    <tspan x="54" dy="18"> 61 |           qteStock: medicament.qteStock,</tspan>
    <tspan x="54" dy="18"> 62 |           quantiteDemandee: data.quantite,</tspan>
    <tspan x="54" dy="18"> 63 |         });</tspan>
    <tspan x="54" dy="18"> 64 |       }</tspan>
    <tspan x="54" dy="18"> 65 | </tspan>
    <tspan x="54" dy="18"> 66 |       const montantTotal = medicament.prix.mul(data.quantite);</tspan>
    <tspan x="54" dy="18"> 67 | </tspan>
    <tspan x="54" dy="18"> 68 |       await this.venteRepository.decrementMedicamentStock(</tspan>
    <tspan x="54" dy="18"> 69 |         data.medicamentId,</tspan>
    <tspan x="54" dy="18"> 70 |         data.quantite,</tspan>
    <tspan x="54" dy="18"> 71 |         transaction,</tspan>
    <tspan x="54" dy="18"> 72 |       );</tspan>
    <tspan x="54" dy="18"> 73 | </tspan>
    <tspan x="54" dy="18"> 74 |       return this.venteRepository.create(</tspan>
    <tspan x="54" dy="18"> 75 |         {</tspan>
    <tspan x="54" dy="18"> 76 |           clientId: data.clientId,</tspan>
    <tspan x="54" dy="18"> 77 |           medicamentId: data.medicamentId,</tspan>
    <tspan x="54" dy="18"> 78 |           quantite: data.quantite,</tspan>
    <tspan x="54" dy="18"> 79 |           dateVente: data.dateVente,</tspan>
    <tspan x="54" dy="18"> 80 |           montantTotal,</tspan>
    <tspan x="54" dy="18"> 81 |         },</tspan>
    <tspan x="54" dy="18"> 82 |         transaction,</tspan>
    <tspan x="54" dy="18"> 83 |       );</tspan>
    <tspan x="54" dy="18"> 84 |     });</tspan>
  </text>
