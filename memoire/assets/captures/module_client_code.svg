  <text x="54" y="930" class="code" xml:space="preserve">
    <tspan x="54" dy="0"> 56 |   async delete(id: string) {</tspan>
    <tspan x="54" dy="18"> 57 |     const client = await this.getById(id);</tspan>
    <tspan x="54" dy="18"> 58 | </tspan>
    <tspan x="54" dy="18"> 59 |     if (client._count.ventes &gt; 0) {</tspan>
    <tspan x="54" dy="18"> 60 |       throw new AppError(409, "Suppression interdite: ce client est associe a des ventes.", {</tspan>
    <tspan x="54" dy="18"> 61 |         clientId: id,</tspan>
    <tspan x="54" dy="18"> 62 |         ventesCount: client._count.ventes,</tspan>
    <tspan x="54" dy="18"> 63 |       });</tspan>
    <tspan x="54" dy="18"> 64 |     }</tspan>
    <tspan x="54" dy="18"> 65 | </tspan>
    <tspan x="54" dy="18"> 66 |     return this.clientRepository.delete(id);</tspan>
    <tspan x="54" dy="18"> 67 |   }</tspan>
  </text>
