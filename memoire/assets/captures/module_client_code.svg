    <tspan x="54" dy="18"> 11 | </tspan>
    <tspan x="54" dy="18"> 12 |   router.get("/", asyncHandler(controller.list));</tspan>
    <tspan x="54" dy="18"> 13 |   router.post("/", validate(validator.getCreateSchema()), asyncHandler(controller.create));</tspan>
    <tspan x="54" dy="18"> 14 |   router.get("/:id", validate(validator.getIdSchema()), asyncHandler(controller.getById));</tspan>
    <tspan x="54" dy="18"> 15 |   router.patch("/:id", validate(validator.getUpdateSchema()), asyncHandler(controller.update));</tspan>
    <tspan x="54" dy="18"> 16 |   router.delete("/:id", validate(validator.getIdSchema()), asyncHandler(controller.delete));</tspan>
    <tspan x="54" dy="18"> 17 | </tspan>
