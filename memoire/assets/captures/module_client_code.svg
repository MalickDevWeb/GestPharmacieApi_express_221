  <text x="54" y="500" class="code" xml:space="preserve">
    <tspan x="54" dy="0"> 14 |   private async ensureEmailAvailable(email: string, clientId?: string) {</tspan>
    <tspan x="54" dy="18"> 15 |     const existingClient = await this.clientRepository.findByEmail(email, clientId);</tspan>
    <tspan x="54" dy="18"> 16 | </tspan>
    <tspan x="54" dy="18"> 17 |     if (existingClient) {</tspan>
    <tspan x="54" dy="18"> 18 |       throw new AppError(409, "L'email client existe deja.", {</tspan>
    <tspan x="54" dy="18"> 19 |         email,</tspan>
    <tspan x="54" dy="18"> 20 |       });</tspan>
    <tspan x="54" dy="18"> 21 |     }</tspan>
    <tspan x="54" dy="18"> 22 |   }</tspan>
    <tspan x="54" dy="18"> 23 | </tspan>
    <tspan x="54" dy="18"> 24 |   async list() {</tspan>
    <tspan x="54" dy="18"> 25 |     return this.clientRepository.list();</tspan>
    <tspan x="54" dy="18"> 26 |   }</tspan>
    <tspan x="54" dy="18"> 27 | </tspan>
    <tspan x="54" dy="18"> 28 |   async create(data: CreateClientDTO) {</tspan>
    <tspan x="54" dy="18"> 29 |     await this.ensureEmailAvailable(data.email);</tspan>
    <tspan x="54" dy="18"> 30 | </tspan>
    <tspan x="54" dy="18"> 31 |     return this.clientRepository.create(data);</tspan>
  </text>
