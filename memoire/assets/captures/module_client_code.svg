  <text x="54" y="162" class="paneltitle">src/modules/client/client.routes.ts | lignes 8-18</text>
  <text x="54" y="196" class="code" xml:space="preserve">
    <tspan x="54" dy="0">  8 | export const buildClientRouter = (controller: ClientController) =&gt; {</tspan>
    <tspan x="54" dy="18">  9 |   const router = Router();</tspan>
